name: CI/CD Pipeline - Bahia Principe BI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-backend:
    name: Python Backend & Database CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bahia_principe_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax (py_compile)
        run: |
          python -m py_compile main.py database.py app.py etl/etl_pipeline.py

      - name: Test Database Connection & Model Initialization
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bahia_principe_db
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_test_key' }}
        run: |
          python -c "
          from database import engine, init_db, SessionLocal, ReservaServicio
          init_db()
          session = SessionLocal()
          print('PostgreSQL connection and tables successfully verified!')
          session.close()
          "

  android-app:
    name: Android App Build CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: ./android_project
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android_project
        run: ./gradlew assembleDebug --no-daemon --stacktrace
